[package]
name = "lxephemeris-cli"
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Command-line interface for lxephemeris: calc, houses, panchanga, swetest, fetch-kernel, data-sync, chart-bench, and license-verify"

[[bin]]
name = "lxephemeris-cli"
path = "src/main.rs"

[features]
default = ["swe-compat"]
swe-compat = ["lxephemeris-core/swe-compat"]
commercial = ["swe-compat", "lxephemeris-core/commercial"]

[lints]
workspace = true

[dependencies]
lxephemeris-core = { version = "1.0.0", path = "../lxephemeris-core", default-features = false }
anise.workspace = true
hifitime.workspace = true
sofars.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
clap.workspace = true
ureq.workspace = true
base64.workspace = true
